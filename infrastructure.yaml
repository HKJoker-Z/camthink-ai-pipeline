# Infrastructure for the V1 topology: the AI server is both control host and
# compute host; the NG4511 is a deployment target reached over passwordless SSH.
# No secrets here. Use ${ENV_VAR} to pull sensitive values from the environment.
schema_version: 1

projects_root: ./projects
artifact_root: ./artifacts

compute_backends:
  # Jobs run on this machine (the AI server) as detached subprocesses.
  # `python` = interpreter with the `provider-ultralytics` extra installed;
  # omit it to use the same interpreter that runs the CLI.
  local:
    type: local
    # python: /data/venvs/aip-ml/bin/python

deployment_targets:
  # Local stand-in for a device; used by tests and dry runs.
  fake:
    type: fake
    root: ./.fake-target

  # CamThink NeoEdge NG4511. `ssh_host` is an alias from ~/.ssh/config
  # (hostname/IP, user, key, and host-key pinning live there). User-owned install root,
  # no sudo; the vendor's own inference service is left untouched.
  ng4511-lab:
    type: camthink_ng4511
    ssh_host: camthink-test
    install_root: ~/camthink-ai
    service_name: camthink-ai-inference      # systemd --user unit; set to null to disable
    inference_source: "${NG4511_RTSP_URL:-}" # RTSP URL for the service; empty = loop over samples
    trtexec: /usr/src/tensorrt/bin/trtexec
    workspace_mb: 1024
    build_timeout_s: 1800
    fps_limit: 5
    # Live view (M9). The camera URL itself is NOT configured here: `ai-pipeline app source
    # set <project>` stores it on the device only (service/app.json, mode 0600).
    liveview_service_name: camthink-ai-liveview   # second systemd --user unit; null = none
    liveview_port: 8080                           # seeds the device app.json on first use
    # liveview_host: 192.168.5.222                # LAN address for browsers; default = ssh -G HostName
    device_label: "NG4511 lab"                    # shown on the live-view page
