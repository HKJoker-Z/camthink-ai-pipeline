[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camthink-ai-pipeline"
version = "0.1.0.dev0"
description = "Reusable, automation-friendly AI model lifecycle pipeline for CamThink edge AI devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.5,<3",
    "typer>=0.12",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "rich>=13",
    "pillow>=10",
]

[project.optional-dependencies]
# Installed only in the interpreter that runs jobs (compute_backends.<name>.python).
# Never imported by the CLI/control plane.
provider-ultralytics = ["ultralytics>=8.3"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
ai-pipeline = "ai_pipeline.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_pipeline = ["templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that need real ML libraries or take minutes",
    "hardware: tests that need the AI server or an NG4511 (opt-in via AIP_HW_TESTS=1)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
